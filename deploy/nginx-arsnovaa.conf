# Arsnovaa static site — Nginx virtual host
# Install only after confirming no existing server_name conflict.
# Before issuing TLS: start with HTTP to allow Certbot's nginx plugin to configure HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name arsnovaa.com www.arsnovaa.com;

    root /var/www/arsnovaa/site;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|ico|png|webp|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
