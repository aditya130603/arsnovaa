name: Validate Arsnovaa Website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/experience.js
      - name: Check internal routes, homepage assets and canonical URLs
        run: python3 scripts/validate_site.py
